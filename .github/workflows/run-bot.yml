name: Run Telegram Bot

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mvp-telegram-bot
    paths:
      - ".github/workflows/run-bot.yml"

concurrency:
  group: pohudai-telegram-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$BOT_TOKEN" || (echo "Missing GitHub Secret: BOT_TOKEN" && exit 1)
          test -n "$GEMINI_API_KEY" || (echo "Missing GitHub Secret: GEMINI_API_KEY" && exit 1)

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: gemini
          GEMINI_MODEL: gemini-3.5-flash-lite
          DATABASE_URL: sqlite+aiosqlite:///./pohudai.db
          APP_TIMEZONE: Europe/Amsterdam
        run: python -m app.main

name: Debug Gemini Search

on:
  push:
    branches:
      - feat/mvp-telegram-bot
    paths:
      - ".github/workflows/debug-gemini-search.yml"

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Gemini Search diagnostics
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import traceback
          import importlib.metadata
          import signal
          from google import genai
          from google.genai import types

          print("google-genai", importlib.metadata.version("google-genai"))
          print("model", "gemini-3.5-flash-lite")

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          model = "gemini-3.5-flash-lite"

          def run_with_timeout(seconds, fn):
              def handler(signum, frame):
                  raise TimeoutError(f"diagnostic call exceeded {seconds}s")
              old = signal.signal(signal.SIGALRM, handler)
              signal.alarm(seconds)
              try:
                  return fn()
              finally:
                  signal.alarm(0)
                  signal.signal(signal.SIGALRM, old)
          prompt = """
          Сначала ОБЯЗАТЕЛЬНО выполни Google Search. Не отвечай по памяти.
          Найди пищевую ценность на 100 г для продукта "Соус Цезарь Смик".
          Верни один объект для component_id c1 с calories_100g, protein_g_100g,
          fat_g_100g, carbs_g_100g, source и confidence.
          """
          schema = {
              "type": "object",
              "additionalProperties": False,
              "properties": {
                  "items": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "additionalProperties": False,
                          "properties": {
                              "component_id": {"type": "string"},
                              "name": {"type": "string"},
                              "calories_100g": {"type": "number"},
                              "protein_g_100g": {"type": "number"},
                              "fat_g_100g": {"type": "number"},
                              "carbs_g_100g": {"type": "number"},
                              "source": {"type": "string"},
                              "confidence": {"type": "number"},
                          },
                          "required": [
                              "component_id","name","calories_100g","protein_g_100g",
                              "fat_g_100g","carbs_g_100g","source","confidence"
                          ],
                      },
                  }
              },
              "required": ["items"],
          }

          print("\n=== TEST 0: gemini-3.5-flash-lite without Google Search ===")
          try:
              resp = run_with_timeout(15, lambda: client.models.generate_content(
                  model=model,
                  contents=["Return JSON with {\\\"ok\\\": true}."],
                  config=types.GenerateContentConfig(
                      response_mime_type="application/json",
                      response_json_schema={
                          "type": "object",
                          "properties": {"ok": {"type": "boolean"}},
                          "required": ["ok"],
                      },
                  ),
              ))
              print("plain response:", (resp.text or "")[:500])
          except Exception as exc:
              print("PLAIN EXCEPTION:", repr(exc))
              traceback.print_exc()

          def dump_grounding(resp):
              candidates = getattr(resp, "candidates", None) or []
              if not candidates:
                  print("candidates: NONE")
                  return
              gm = getattr(candidates[0], "grounding_metadata", None)
              print("grounding_metadata present:", bool(gm))
              if gm:
                  print("web_search_queries:", getattr(gm, "web_search_queries", None))
                  chunks = getattr(gm, "grounding_chunks", None) or []
                  print("grounding_chunks count:", len(chunks))
                  for chunk in chunks[:5]:
                      web = getattr(chunk, "web", None)
                      if web:
                          print("source:", getattr(web, "title", None), getattr(web, "uri", None))

          print("\n=== TEST 1: generateContent + search + structured output (current app path) ===")
          try:
              resp = run_with_timeout(25, lambda: client.models.generate_content(
                  model=model,
                  contents=[prompt],
                  config=types.GenerateContentConfig(
                      tools=[types.Tool(google_search=types.GoogleSearch())],
                      response_mime_type="application/json",
                      response_json_schema=schema,
                  ),
              ))
              print("text:", (resp.text or "")[:3000])
              dump_grounding(resp)
          except Exception as exc:
              print("EXCEPTION:", repr(exc))
              traceback.print_exc()

          print("\n=== TEST 2: Interactions AUTO + search + structured output ===")
          try:
              interaction = run_with_timeout(25, lambda: client.interactions.create(
                  model=model,
                  input=prompt,
                  tools=[{"type": "google_search"}],
                  response_format={
                      "type": "text",
                      "mime_type": "application/json",
                      "schema": schema,
                  },
              ))
              print("output_text:", (getattr(interaction, "output_text", None) or "")[:3000])
              steps = getattr(interaction, "steps", None) or []
              print("step types:", [getattr(step, "type", None) for step in steps])
              for step in steps:
                  if getattr(step, "type", None) in ("google_search_call", "google_search_result", "model_output"):
                      try:
                          print("step:", json.dumps(step.model_dump(mode="json", exclude_none=True), ensure_ascii=False)[:5000])
                      except Exception:
                          print("step repr:", repr(step)[:5000])
          except Exception as exc:
              print("EXCEPTION:", repr(exc))
              traceback.print_exc()

          print("\n=== TEST 2.5: gemini-2.5-flash-lite + Google Search + structured output ===")
          try:
              resp25 = run_with_timeout(25, lambda: client.models.generate_content(
                  model="gemini-2.5-flash-lite",
                  contents=[prompt],
                  config=types.GenerateContentConfig(
                      tools=[types.Tool(google_search=types.GoogleSearch())],
                      response_mime_type="application/json",
                      response_json_schema=schema,
                  ),
              ))
              print("2.5 text:", (resp25.text or "")[:3000])
              dump_grounding(resp25)
          except Exception as exc:
              print("2.5 EXCEPTION:", repr(exc))
              traceback.print_exc()

          print("\n=== TEST 3: Interactions ANY + search + structured output ===")
          try:
              interaction = run_with_timeout(25, lambda: client.interactions.create(
                  model=model,
                  input=prompt,
                  tools=[{"type": "google_search"}],
                  generation_config={"tool_choice": "any"},
                  response_format={
                      "type": "text",
                      "mime_type": "application/json",
                      "schema": schema,
                  },
              ))
              print("output_text:", (getattr(interaction, "output_text", None) or "")[:3000])
              steps = getattr(interaction, "steps", None) or []
              print("step types:", [getattr(step, "type", None) for step in steps])
              for step in steps:
                  if getattr(step, "type", None) in ("google_search_call", "google_search_result", "model_output"):
                      try:
                          print("step:", json.dumps(step.model_dump(mode="json", exclude_none=True), ensure_ascii=False)[:5000])
                      except Exception:
                          print("step repr:", repr(step)[:5000])
          except Exception as exc:
              print("EXCEPTION:", repr(exc))
              traceback.print_exc()
          PY
